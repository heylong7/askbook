name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src/

      - name: Pytest + coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Pytest (golden — informational on fork PRs)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ASKBOOK_GOLDEN_ALLOW_SKIP: "1"
        run: |
          if [ -d "examples/docs/seed" ] && [ -f "datasets/seed_manual.yaml" ]; then
            uv run pytest -m golden -v
          else
            echo "::warning::seed_manual fixtures missing — skipping golden tests"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            .coverage
            htmlcov/
          if-no-files-found: ignore
