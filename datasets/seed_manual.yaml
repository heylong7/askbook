  - qid: "Q011"
    question: "MCP Server 注册了哪些工具？核心工具和诊断工具分别有哪些？"
    ground_truth: "共 6 个工具。核心工具（4 个）：search（语义搜索返回片段）、ask（完整 RAG 问答+引用）、list_collections（列出所有 collection）、get_document_summary（查看文档摘要）。诊断工具（2 个）：explain_retrieval（展示检索到的 chunk 及原因）、health_check（返回 LLM/Chroma/BM25 健康状态）。所有工具返回统一的 ToolResponse 封套。"
