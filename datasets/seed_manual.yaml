  - qid: "Q013"
    question: "Streamlit Dashboard 包含哪些页面？Page 4 Trace Viewer 如何帮助诊断慢查询？"
    ground_truth: "5 页：Page 1 系统总览（健康状态+今日统计+24h 趋势）、Page 2 数据浏览（Chroma 文档/chunk 列表）、Page 3 Ingestion 管理（历史记录+Plotly Gantt 图）、Page 4 Trace Viewer（Query 列表+瀑布图）、Page 5 评估面板（指标趋势+对比）。Page 4 解析最近 7 天 JSONL，展示每次查询的各节点耗时瀑布图，点击可展开定位慢节点。使用 @st.cache_data + mtime 增量刷新。"
