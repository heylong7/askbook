    question: "如何从零开始安装 askbook 并进行第一次文档查询？请列出完整步骤。"
    ground_truth: "步骤：1. 安装 Python 3.12+ 和 uv；2. git clone 项目后运行 uv sync --all-extras；3. cp .env.example .env 配置环境变量；4. 导入文档：askbook ingest examples/docs/seed/ --collection demo；5. 语义搜索：askbook query search '什么是 RAG？' --collection demo；6. 问答：askbook query ask '如何评估检索质量？' --collection demo。所有步骤在本地完成，无需云端 API。"
