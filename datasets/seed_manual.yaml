  # ============================================================
  # Q015-Q017: Chinese-English bilingual retrieval tests (3 items)
  # ============================================================
  - qid: "Q015"
    question: "What is the RRF k value used in askbook's hybrid retrieval, and why is RRF preferred over weighted sum fusion?"
    ground_truth: "RRF uses k=60 as the smoothing constant. RRF is preferred because it only depends on ranking positions, not absolute scores. BM25 scores and cosine similarity scores are in completely different ranges and cannot be meaningfully compared, making weighted sum unreliable. RRF resolves this by converting everything to reciprocal ranks, which are comparable across heterogeneous retrieval systems."
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:1"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["bilingual", "retrieval"]

  - qid: "Q016"
    question: "如何在 Claude Desktop 中配置 askbook 的 MCP Server？请列出完整的接入步骤。"
    ground_truth: "步骤：1. 确保 Ollama 运行并拉取模型（ollama serve + ollama pull qwen2.5:7b）；2. 导入至少一个 collection（askbook ingest docs/ --collection demo）；3. 将 examples/claude_desktop_mcp.json 内容合并到 Claude Desktop 的 MCP 配置文件；4. 重启 Claude Desktop。配置使用 uv run askbook serve --collection demo 作为 command，通过 env 设置 ASKBOOK_LLM__PROVIDER=ollama 等环境变量。"
    relevant_chunk_ids:
      - "TODO:01_quick_start:2"
      - "TODO:04_mcp_server:2"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["bilingual", "retrieval"]

  - qid: "Q017"
    question: "Explain askbook's 混合检索 (hybrid retrieval) strategy — how do BM25 and BGE-M3 dense retrieval complement each other in the query pipeline?"
    ground_truth: "BM25 is a sparse lexical retrieval algorithm based on TF-IDF that excels at exact keyword matching and handles rare terms well. BGE-M3 is a dense multilingual embedding model that captures semantic similarity, handling synonyms and paraphrases. In the query pipeline, they run in parallel via asyncio.gather, each returning top_k*2 candidates. Their results are fused by RRF (k=60), which combines rankings without requiring score normalization. This dual approach solves the semantic-vs-literal imbalance that plagues single-method retrieval systems."
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:0"
      - "TODO:03_hybrid_retrieval:1"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["bilingual", "retrieval"]

