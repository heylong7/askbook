  - qid: "Q009"
    question: "从文档导入到可检索，Ingestion Pipeline 的完整流程是怎样的？每个节点的输入输出是什么？"
    ground_truth: "7 节点流程：DocumentLoaderNode（文件→Markdown Document）→ SplitterNode（Document→list[Chunk]）→ EnrichmentNode（注入图片描述和元数据）→ DedupNode（SHA256 去重，输出 new_chunks 和 stale_chunk_ids）→ EmbeddingNode（BGE-M3 生成 dense embedding）→ VectorStoreWriteNode（upsert 新 chunk + 软删除旧 chunk）→ BM25IndexUpdateNode（更新持久化 BM25 pickle 索引）。最终输出 IngestionResult。"
    relevant_chunk_ids:
      - "TODO:02_ingestion:0"
      - "TODO:02_ingestion:1"
      - "TODO:02_ingestion:2"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q010"
    question: "用户提问后，Query Pipeline 经过哪些节点处理？各节点负责什么？"
    ground_truth: "Query Pipeline 7 节点：QueryRewriterNode（默认 passthrough）→ HyDENode（默认 disabled）→ HybridRetrieverNode（BM25 + BGE-M3 并行检索，取 top_k*2 候选）→ RRFFusionNode（RRF k=60 融合排名）→ CrossEncoderRerankNode（bge-reranker-v2-m3 精排至 top_k）→ LLMFineRerankNode（可选 LLM 精排）→ AnswerSynthesizerNode（Jinja2 模板合成答案 + 引用标注）。输出 Answer + Citations。"
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:0"
      - "TODO:03_hybrid_retrieval:1"
