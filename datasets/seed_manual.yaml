  # Q001-Q008: retrieval-friendly single-chunk hits (8 items)
  # ============================================================
  - qid: "Q001"
    question: "askbook 的混合检索使用了哪两种召回方式？"
    ground_truth: "BM25（稀疏检索，擅长关键字精确匹配）和 BGE-M3（稠密向量检索，擅长语义匹配），通过 RRF 融合排名。"
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:0"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q002"
    question: "RRF 融合算法的公式是什么？默认 k 值是多少？"
    ground_truth: "RRF score(d) = sum(1/(k + rank(d))) across all ranked lists。默认 k=60，是标准平滑常数。RRF 只依赖排名不依赖绝对分数，适合异构检索系统融合。"
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:1"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q003"
    question: "BGE-M3 在 askbook 中扮演什么角色？它有哪些关键特性？"
    ground_truth: "BGE-M3 是通用多语言稠密向量模型（BAAI General Embedding M3），在 askbook 中负责生成 chunk 的 dense embedding 和 query embedding。支持中英文多语言，本地部署零 API 成本，MTEB 多语言排名前 5。"
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:0"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q004"
    question: "Ingestion Pipeline 使用什么哈希算法进行文档去重？chunk_id 是如何生成的？"
    ground_truth: "使用 SHA256 算法。doc_id = SHA256(abspath + mtime_ns) 确保幂等。chunk_id = SHA256(doc_id:chunk_index:content) 保证唯一标识。去重时比较 chunk_id，已存在的跳过，旧版本文档中不再出现的 chunk 被软删除。"
    relevant_chunk_ids:
      - "TODO:02_ingestion:1"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q005"
    question: "Cross-Encoder 和 Bi-Encoder 在 RAG 检索中有什么区别？askbook 如何利用两者？"
    ground_truth: "Bi-Encoder 分别编码 query 和 passage，可预计算 passage embedding，检索速度快 O(1)。Cross-Encoder 联合编码 (query, passage) 对，更准确但不可预计算，适合精排阶段。askbook 用 BGE-M3 (Bi-Encoder) 做召回，bge-reranker-v2-m3 (Cross-Encoder) 做精排。"
    relevant_chunk_ids:
      - "TODO:03_hybrid_retrieval:2"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q006"
    question: "MCP Server 使用什么传输模式？为什么选择这个模式？"
    ground_truth: "使用 stdio 传输模式（标准输入输出）。stdout 用于 JSON-RPC 消息，stderr 用于日志输出。选择理由：本地场景标准方式，零额外依赖，适合单用户 Claude Desktop 接入。"
    relevant_chunk_ids:
      - "TODO:04_mcp_server:0"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q007"
    question: "ToolResponse 的 source_ids 字段有什么强制约束？为什么要加这个约束？"
    ground_truth: "pydantic model_validator 强制要求：status=success 时 source_ids 必须非空。如果检索结果为空，必须返回 status=warning。目的是防止 Hallucinated Completion——当检索无结果时 LLM 可能编造答案，validator 在构造期就拦截此类情况，不依赖运行时逻辑判断。"
    relevant_chunk_ids:
      - "TODO:04_mcp_server:1"
    relevant_doc_ids: []
    provenance: "manual"
    tags: ["retrieval"]

  - qid: "Q008"
    question: "askbook 的 JSONL Trace 日志存放在哪里？按什么方式分片？"
    ground_truth: "存放在 ~/.askbook/traces/ 目录下，按日期分片为 YYYY-MM-DD.jsonl 文件。使用 AsyncTraceWriter 后台线程异步写入，atexit 保证进程退出时 flush。可配置 retention_days（默认 7 天）自动清理过期文件。"
    relevant_chunk_ids:
