  - qid: "Q019"
    question: "askbook 的质量门禁包含哪些检查？开发时如何运行？"
    ground_truth: "质量门禁包含 ruff check（lint）、ruff format --check（格式检查）、mypy --strict src/（类型检查）、pytest --cov=src/askbook --cov-fail-under=80（测试+覆盖率 >= 80%）。一键运行：uv run ruff check . && uv run ruff format --check . && uv run mypy --strict src/ && uv run pytest --cov=src/askbook --cov-fail-under=80 -q。CI 在 PR 时自动执行全部检查。"
