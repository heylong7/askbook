  - qid: "Q014"
    question: "askbook 的配置系统采用了什么策略来管理不同环境的设置？Provider Fallback Chain 是如何工作的？"
    ground_truth: "三分法策略：YAML 文件存储非敏感配置、.env 文件注入密钥、pydantic-settings 启动时强类型校验。多环境通过多份 YAML（如 ollama-only.yaml / dashscope-cloud.yaml）+ --config 参数切换，环境变量可覆盖 YAML 任意字段。Provider Fallback Chain 在 LLM 配置中定义降级链（如 DashScope 超时自动切换 Ollama），按顺序尝试直到成功，保证高可用。"
