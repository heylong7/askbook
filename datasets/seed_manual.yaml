  - qid: "Q012"
    question: "askbook 的评估体系包含哪些层级的数据集？4 类指标分别衡量什么？"
    ground_truth: "三级数据集：Level 1 seed_manual（手工精标 20-30 条，CI 回归 < 2 分钟）、Level 2 llm_generated（LLM 自动生成 + judge 过滤）、Level 3 user_feedback（Dashboard 点赞/踩收集）。4 类指标：检索指标（hit_rate/MRR/Recall@K/NDCG，纯代码零 LLM 成本）、生成指标（Ragas faithfulness/answer_relevancy/context_precision/recall）、LLM Judge 指标（accuracy/relevance/groundedness）、成本延迟指标（P50/P90/P99 延迟+Token+成本）。"
