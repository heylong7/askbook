[project]
name = "askbook"
version = "0.1.0"
description = "Local RAG + MCP Server for private knowledge bases"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "askbook contributors" }]
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
  "markitdown>=0.0.1a2",
  "chromadb>=0.6",
  "rank-bm25>=0.2.2",
  "FlagEmbedding>=1.2.10",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "pre-commit>=3.7",
  "detect-secrets>=1.5",
  "types-PyYAML>=6.0",
  "respx>=0.21",
]

[project.scripts]
askbook = "askbook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askbook"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/askbook/core/registry.py" = ["ANN401"]
"src/askbook/vectorstores/chroma_store.py" = ["ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["askbook"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["askbook.cli"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
  "markitdown",
  "markitdown.*",
  "chromadb",
  "chromadb.*",
  "rank_bm25",
  "FlagEmbedding",
  "FlagEmbedding.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "httpx",
  "httpx.*",
  "jinja2",
  "jinja2.*",
  "respx",
  "respx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "requires_ollama: integration test that needs a local Ollama daemon",
  "requires_dashscope: integration test that needs DashScope API key",
  "requires_bge_m3: integration test that downloads BGE-M3 weights",
]

[tool.coverage.run]
branch = true
source = ["src/askbook"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
