# askbook 随包默认配置（真相唯一来源）
log_level: INFO
data_dir: ~/.askbook

# ---- LLM 配置 ----------------------------------------------------------
# provider 可选:
#   ollama     — 本地 Ollama (需先 ollama pull <model>)
#   dashscope  — 阿里云百炼 (需 DASHSCOPE_API_KEY 环境变量)
#   openai     — OpenAI (需 OPENAI_API_KEY 环境变量)
#   anthropic  — Anthropic (需 ANTHROPIC_API_KEY 环境变量)
#   stub       — 测试桩 (固定返回，无需网络)
#
# model 按 provider 常用值:
#   ollama:    qwen2.5:7b / qwen2.5:14b / qwen2.5:32b / llama3:8b / deepseek-r1:8b
#   dashscope: qwen-plus / qwen-max / qwen-turbo
#   openai:    gpt-4o / gpt-4o-mini / gpt-4-turbo / o3-mini
#   anthropic: claude-sonnet-4-6 / claude-opus-4-7 / claude-haiku-4-5
llm:
  provider: ollama
  model: qwen2.5:7b
  temperature: 0.1
  max_tokens: 4096
  fallback_chain: []
  token_limit_per_call: 8000
  quota_per_hour: 100

# ---- Embedding 配置 ----------------------------------------------------
# provider 可选:
#   bge-m3     — 本地 BGE-M3 (需 pip install FlagEmbedding)
#   openai     — OpenAI Embeddings (需 OPENAI_API_KEY 环境变量)
#   dashscope  — 百炼 TextEmbedding (需 DASHSCOPE_API_KEY 环境变量)
#   stub       — 测试桩
#
# model 按 provider 常用值:
#   bge-m3:    BAAI/bge-m3
#   openai:    text-embedding-3-small / text-embedding-3-large
#   dashscope: text-embedding-v3 / text-embedding-v4
embedding:
  provider: bge-m3
  model: BAAI/bge-m3
  normalize: true
  device: auto
  batch_size: 32

vectorstore:
  provider: chroma
  path: ~/.askbook/chroma

ingestion:
  chunk_size: 600
  chunk_overlap: 80
  embed_concurrency: 4
  vision_concurrency: 2
  chroma_concurrency: 4
  # enrich_llm:                      # 图片描述专用 LLM（不设则跳过）
  #   provider: openai
  #   model: gpt-4o-mini

query:
  top_k: 10
  rerank_top_k: 5
  rrf_k: 60
  enable_rewrite: true
  enable_hyde: false
  enable_llm_rerank: false

mcp:
  transport: stdio
  system_prompt_max_tokens: 500

observability:
  trace_dir: ~/.askbook/traces
  flush_interval_seconds: 1.0
  pii_redaction: true
  enabled: true
  retention_days: 7
  dashboard_port: 8501
